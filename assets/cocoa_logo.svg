<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Cocoa Pod Logo - Professional Silhouette with Longitudinal Grooves and Stem Leaf -->
  <defs>
    <!-- Cocoa Pod Body Gradient -->
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="45%" stop-color="#4E2B15"/>
      <stop offset="100%" stop-color="#341A0B"/>
    </linearGradient>
    <!-- Ridge Highlight Gradient -->
    <linearGradient id="ridgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C643E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#804E2C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#552F17" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#408257"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <!-- Background Circle for Contrast -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFEB"/>
      <stop offset="100%" stop-color="#E7DFD6"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#badgeBg)" stroke="#D4C7BA" stroke-width="2"/>

  <!-- Stem / Pedicel -->
  <path d="M 57 23 C 58 17, 62 14, 67 13 C 68 15, 67 19, 62 21 C 60 22, 59 23, 58 25 Z" 
        fill="#3D2314"/>

  <!-- Small Foliage Leaf -->
  <path d="M 64 16 C 75 14, 84 19, 83 26 C 74 27, 67 22, 64 16 Z" 
        fill="url(#leafGrad)"/>
  <!-- Leaf Vein -->
  <path d="M 64 16 Q 74 21 82 25" 
        stroke="#74C69D" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Main Cocoa Pod Body -->
  <!-- Classic Theobroma cacao pod: tapered apex, furrowed ridges -->
  <path d="M 59 25 
           C 76 28, 93 46, 91 69 
           C 89 88, 71 102, 59 107 
           C 47 102, 29 88, 27 69 
           C 25 46, 42 28, 59 25 Z" 
        fill="url(#podGrad)" 
        stroke="#2A1408" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Longitudinal Grooves & Ridges (Anatomical cocoa pod segments) -->
  <!-- Ridge 1 (Far Left) -->
  <path d="M 58 26 C 41 33, 33 55, 36 78 C 38 89, 48 100, 58 106" 
        stroke="url(#ridgeHighlight)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Ridge 2 (Mid Left) -->
  <path d="M 58 26 C 47 34, 43 55, 45 77 C 47 90, 52 100, 58 106" 
        stroke="#271308" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 59 26 C 48 34, 44 55, 46 77 C 48 90, 53 100, 59 106" 
        stroke="url(#ridgeHighlight)" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Center Longitudinal Ridge (Spine) -->
  <path d="M 59 26 C 58 45, 58 80, 59 106" 
        stroke="#231006" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 59.8 26 C 58.8 45, 58.8 80, 59.8 106" 
        stroke="#A76E46" stroke-width="1.3" stroke-linecap="round" fill="none"/>

  <!-- Ridge 3 (Mid Right) -->
  <path d="M 60 26 C 71 34, 75 55, 73 77 C 71 90, 66 100, 60 106" 
        stroke="#271308" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 60.5 26 C 71.5 34, 75.5 55, 73.5 77 C 71.5 90, 66.5 100, 60.5 106" 
        stroke="url(#ridgeHighlight)" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Ridge 4 (Far Right) -->
  <path d="M 60 26 C 77 33, 85 55, 82 78 C 80 89, 70 100, 60 106" 
        stroke="url(#ridgeHighlight)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Pod Tip Detail -->
  <path d="M 57 105 Q 59 109 61 105" stroke="#231006" stroke-width="2" stroke-linecap="round" fill="#3D2314"/>
</svg>
